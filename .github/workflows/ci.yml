name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          pip install "ruff==0.16.10"
      - name: Run ruff
        # No path argument on purpose: `ruff check .` covers the package AND
        # tests/, which is where a third of this repo's findings lived.
        run: |
          ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
      - name: Smoke test CLI
        run: |
          pip install click cryptography
          python -m agent_capability_attestation --version
          # Generate a freshly-issued attestation so this smoke test does not
          # depend on a committed timestamp staying valid forever.
          python - <<'PY'
          import datetime, json
          issued = datetime.datetime.now(datetime.timezone.utc)
          json.dump({
              "issuer": "agent://planner-v2",
              "subject": "agent://worker-v3",
              "capability": "CAN_WRITE(state_store:partition_3)",
              "issued_at": issued.isoformat(),
              "ttl_seconds": 120,
          }, open("/tmp/fresh.attestation.json", "w"))
          PY
          python -m agent_capability_attestation validate /tmp/fresh.attestation.json --json-output
      - name: Smoke test rejects the future-dated example attestation
        run: |
          # examples/valid-attestation.json carries an issued_at in the future.
          # It used to report VALID only because validate() had no clock-skew
          # bound; it must now be rejected rather than silently trusted (#16).
          if python -m agent_capability_attestation validate examples/valid-attestation.json; then
            echo "::error::future-dated attestation was accepted"
            exit 1
          fi
